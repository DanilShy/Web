<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання №6</title>
    <style>
        body {
            background-color: rgb(144, 238, 144);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 20px;
        }

        ul {
            list-style-type: disc;
            padding: 0;
            text-align: left;
        }

        ul li {
            margin: 5px 0;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Завдання №6</h1>
    <ul id="number-list">
        <li>1</li>
        <li>4</li>
        <li>8</li>
        <li>16</li>
        <li>20</li>
        <li>30</li>
    </ul>
    <div class="buttons">
        <button onclick="doubleValues()">Подвоїти</button>
        <button onclick="resetValues()">Reset</button>
    </div>

    <script>
        const initialValues = [1, 4, 8, 16, 20, 30];

        function doubleValues() {
            const listItems = document.querySelectorAll('#number-list li');
            listItems.forEach((item, index) => {
                item.textContent = parseInt(item.textContent, 10) * 2;
            });
        }

        function resetValues() {
            const listItems = document.querySelectorAll('#number-list li');
            listItems.forEach((item, index) => {
                item.textContent = initialValues[index];
            });
        }
    </script>
</body>
</html>
