<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .gallery {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 1440px;
            height: 696px;
            background: #FFFFFF;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .gallery-item {
            width: calc(33.333% - 10px);
            margin-bottom: 10px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            height: 300px; 
        }
        .gallery-link {
            display: block;
            width: 100%;
            height: 100%;
        }
        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transition: transform 0.3s;
        }
        .gallery-image:hover {
            transform: scale(1.05);
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basiclightbox@5.0.4/dist/basicLightbox.min.css">
    <script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js"></script>
</head>
<body>
    <ul class="gallery"></ul>

    <script src="https://cdn.jsdelivr.net/npm/basiclightbox@5.0.4/dist/basicLightbox.min.js"></script>
    <script>
        const images = [
        {
            preview: 'images/flexbox_2.png',
            original: 'images/flexbox_2.png',
            description: 'Текстовий опис зображення 1',
        },
        {
            preview: 'images/flexbox_1.png',
            original: 'images/flexbox_1.png',
            description: 'Текстовий опис зображення 2',
        },
        {
            preview: 'images/desktop_version.png',
            original: 'images/desktop_version.png',
            description: 'Текстовий опис зображення 3',
        },
        {
            preview: 'images/tablet_version1.png',
            original: 'images/tablet_version1.png',
            description: 'Текстовий опис зображення 4',
        },
        {
            preview: 'images/example_flexbox2.png',
            original: 'images/example_flexbox2.png',
            description: 'Текстовий опис зображення 5',
        },
        {
            preview: 'images/phone_version1.png',
            original: 'images/phone_version1.png',
            description: 'Текстовий опис зображення 6',
        },
        ];

        const galleryContainer = document.querySelector('.gallery');

        const galleryMarkup = images.map(({ preview, original, description }) => {
            return `
                <li class="gallery-item">
                    <a class="gallery-link" href="${original}">
                        <img class="gallery-image" src="${preview}" alt="${description}" data-source="${original}" />
                    </a>
                </li>
            `;
        }).join('');

        galleryContainer.innerHTML = galleryMarkup;

        galleryContainer.addEventListener('click', event => {
            event.preventDefault();
            const isGalleryImage = event.target.classList.contains('gallery-image');
            if (!isGalleryImage) return;

            const instance = basicLightbox.create(`
                <img src="${event.target.dataset.source}" alt="${event.target.alt}">
            `);

            instance.show();
        });

        const msnry = new Masonry(galleryContainer, {
            itemSelector: '.gallery-item',
            columnWidth: '.gallery-item',
            percentPosition: true,
            gutter: 10,
        });
    </script>
</body>
</html>
